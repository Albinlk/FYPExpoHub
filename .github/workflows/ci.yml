name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA (the tag in the
      # comment is what that SHA was when pinned): a tag can be moved to
      # different code, a SHA can't.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          # Pinned so a new Flutter release can't change a build between two
          # runs of the same commit; bump deliberately.
          flutter-version: '3.44.7'

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        # Strict: the lint backlog is cleared (0 issues), so any new info or
        # warning fails the PR instead of silently accumulating again.
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Web (Wasm smoke test)
        # `flutter test` runs on the Dart VM, so it can't catch web-only
        # breakage — e.g. a `dart.library.html` conditional import silently
        # picking a no-op stub under dart2wasm. This compiles exactly what
        # deploy.yml ships.
        run: flutter build web --release --wasm --base-href "/"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check migrations (offline advisor lints)
        # Tables without RLS, unindexed foreign keys, SECURITY DEFINER
        # functions without a pinned search_path, per-row auth.uid() in
        # policies. See tool/lint_migrations.py.
        run: python tool/lint_migrations.py --check

      - name: Build Handbook (strict)
        # --strict turns broken links, missing nav pages and bad anchors in
        # docs/ into a failed PR instead of a broken /handbook/ page.
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict -d build/handbook-check
