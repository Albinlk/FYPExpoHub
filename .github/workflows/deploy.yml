name: Deploy Flutter Web (GitHub Pages + FYP Workspace)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in a step's `if:`; expose whether it is set.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # Pinned to commit SHAs (tag in the comment): this job holds
      # pages:write and id-token:write, so a moved tag must not be able to
      # swap in different code.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.44.7'

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Web
        run: |
          flutter build web --release --wasm --base-href "/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=CSP_HOST="${{ vars.CSP_HOST }}"
          cp build/web/index.html build/web/404.html
          # Stamp the deploy version into the service worker + its
          # registration URL so each release gets a fresh asset cache.
          DEPLOY_VERSION="${GITHUB_SHA::12}"
          sed -i "s/{{BUILD_VERSION}}/${DEPLOY_VERSION}/g" \
            build/web/sw.js build/web/flutter_bootstrap.js

      # The same build serves the FYP Workspace (CSP600 / CSP650) on its own
      # host; the app tells the two apart at runtime (lib/app/site_hosts.dart).
      # Repo variable CSP_HOST stays empty until fyp. is live, so the main site
      # keeps /fypms until then. See DEPLOYMENT.md, "Moving the FYP Workspace".
      - name: Prepare Workspace Copy
        run: |
          cp -r build/web build/workspace
          # Cloudflare Pages treats a site without 404.html as a single-page
          # app and serves index.html for deep links with status 200.
          rm build/workspace/404.html
          # Sign-in only: keep it out of search results.
          printf '/*\n  X-Robots-Tag: noindex\n' > build/workspace/_headers

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # Runs once the Cloudflare secrets exist; skipped (not failed) before.
      - name: Deploy FYP Workspace to Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/workspace --project-name=fyp-workspace --branch=main --commit-dirty=true
