name: Uptime Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site availability
        id: probe
        run: |
          set +e
          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 40 "https://fskmjasinfypexhibition.site/" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "status=ok" >> "$GITHUB_OUTPUT"
              echo "Site is UP (attempt $attempt, HTTP $status)"
              exit 0
            fi
            echo "Attempt $attempt failed with HTTP $status, retrying..."
            sleep 10
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open issue if site is down
        if: steps.probe.outputs.status == 'down'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = 'incident';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident'
            });
            if (existing.data.length > 0) {
              console.log('Incident issue already open, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 fskmjasinfypexhibition.site is down',
              body: `The site did not respond with HTTP 200 across 3 attempts.

- **Time (UTC):** ${new Date().toISOString()}
- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
- **Domain:** https://fskmjasinfypexhibition.site/

Check DNS records (185.199.108.153 etc.) and GitHub Pages status.`,
              labels: [labels]
            });

      - name: Close incident issue when site recovers
        if: steps.probe.outputs.status == 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident'
            });
            for (const issue of existing.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed incident issue #${issue.number}`);
            }
