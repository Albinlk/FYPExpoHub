name: Uptime Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site availability
        id: probe
        run: |
          set +e
          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 40 "https://fskmjasinfypexhibition.site/" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "status=ok" >> "$GITHUB_OUTPUT"
              echo "Site is UP (attempt $attempt, HTTP $status)"
              exit 0
            fi
            echo "Attempt $attempt failed with HTTP $status, retrying..."
            sleep 10
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          exit 0

      # Free Supabase projects pause after 7 days without database activity
      # and are deleted after 90 days paused. The site check above only
      # fetches static files, so it never counts; this one-row read does.
      - name: Keep Supabase active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 40 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" 2>/dev/null)
          if [ "$status" = "200" ]; then
            echo "Supabase answered (HTTP $status)."
          else
            echo "::warning::Supabase did not answer normally (HTTP $status). If the project is paused, restore it in the Supabase dashboard."
          fi

      - name: Open issue if site is down
        if: steps.probe.outputs.status == 'down'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = 'incident';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident'
            });
            if (existing.data.length > 0) {
              console.log('Incident issue already open, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 fskmjasinfypexhibition.site is down',
              body: [
                'The site did not respond with HTTP 200 across 3 attempts.',
                '',
                '- **Time (UTC):** ' + new Date().toISOString(),
                '- **Run:** ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                '- **Domain:** https://fskmjasinfypexhibition.site/',
                '',
                'Check DNS records (185.199.108.153 etc.) and GitHub Pages status.'
              ].join('\n'),
              labels: [labels]
            });

      - name: Close incident issue when site recovers
        if: steps.probe.outputs.status == 'ok'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident'
            });
            for (const issue of existing.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed incident issue #${issue.number}`);
            }
