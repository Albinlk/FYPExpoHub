services:
  fyp-expo-hub:
    build:
      context: .
      dockerfile: Dockerfile
      # Firebase credentials are passed as build-time args from the .env file.
      # They are baked into the compiled Flutter Web binary — NOT stored in source code.
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
    image: fyp-expo-hub:latest
    container_name: fyp_expo_hub
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:80"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider --timeout=5 http://localhost:80/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
