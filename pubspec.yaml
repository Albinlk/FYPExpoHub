name: fyp_expo_hub
description: "FYP Expo Hub - Modern Academic Exhibition Management Portal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  intl: ^0.20.3
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  excel: ^4.0.6
  csv: ^5.0.2
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/csp600-proposals.csv
    - assets/data/offline_fallback.json
  # Fonts are served as WOFF2 via web/index.html preload + @font-face
  # (smaller than TTF, avoids double-download). No pubspec TTF needed.
