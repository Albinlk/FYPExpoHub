name: fyp_expo_hub
description: "FYP Expo Hub - Modern Academic Exhibition Management Portal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Not imported in lib/, but Flutter framework widgets reference
  # CupertinoIcons glyphs; without this their font is missing from the
  # build (the web build warns and those icons render as boxes).
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  uuid: ^4.6.0
  crypto: ^3.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.8.4
  excel: ^4.0.6
  csv: ^5.0.2
  http: ^1.2.0
  web: ^1.1.1
  # Imported directly (external links, sign-in help); previously only
  # resolved transitively through supabase_flutter.
  url_launcher: ^6.3.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  # Tests stub it for Supabase.initialize; the app only needs it
  # transitively (supabase_flutter), so it is a dev dependency.
  shared_preferences: ^2.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/csp600-proposals.csv
    - assets/data/offline_fallback.json
  # Flutter web paints text itself and never uses the page's CSS
  # @font-face fonts — those only style the HTML splash in web/index.html.
  # So the app's fonts must be declared here (TTF: Flutter's font loader
  # doesn't read WOFF2). Only the weights the theme uses are bundled;
  # Flutter falls back to the nearest one. Licences: assets/fonts/*-OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
