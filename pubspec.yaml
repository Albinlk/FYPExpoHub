name: fyp_expo_hub
description: "FYP Expo Hub - Modern Academic Exhibition Management Portal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  intl: ^0.20.3
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  excel: ^4.0.6
  csv: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  http: ^1.2.0
  shared_preferences: ^2.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/csp600-proposals.csv

  fonts:
    - family: Inter
      fonts:
        - asset: web/fonts/Inter-Regular.ttf
          weight: 400
        - asset: web/fonts/Inter-Medium.ttf
          weight: 500
        - asset: web/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: web/fonts/Inter-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: web/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: web/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: web/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: web/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: web/fonts/Montserrat-ExtraBold.ttf
          weight: 800
