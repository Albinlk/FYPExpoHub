<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FYP Expo Hub - UiTM FSKM Final Year Project Exhibition">

  <!-- Link previews (WhatsApp, Telegram, social) -->
  <link rel="canonical" href="https://fskmjasinfypexhibition.site/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FYP Expo Hub">
  <meta property="og:title" content="FYP Expo Hub — FSKM Final Year Project Exhibition">
  <meta property="og:description" content="Browse final year projects, find exhibition booths, and see the schedule and award winners of the UiTM FSKM FYP Exhibition.">
  <meta property="og:url" content="https://fskmjasinfypexhibition.site/">
  <meta property="og:image" content="https://fskmjasinfypexhibition.site/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- Content Security Policy. GitHub Pages can't send response headers, so
       it's a meta tag (which can't carry frame-ancestors — anti-framing for
       the admin/lecturer/FYPMS areas is done in flutter_bootstrap.js).
       No inline scripts are allowed; the Flutter engine (CanvasKit/skwasm)
       and its fallback fonts come from Google's CDN, data from Supabase.
       'wasm-unsafe-eval' is required to instantiate the dart2wasm build. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">

  <!-- Font for the HTML splash below ONLY. The Flutter app paints its own
       text and loads Inter / Fraunces / JetBrains Mono from its bundled
       assets (pubspec.yaml `fonts:`); it never uses this CSS font. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/Fraunces-Bold.woff2">
  <style>
    @font-face {
      font-family: 'Fraunces';
      src: url('fonts/Fraunces-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <!-- Google Fonts removed: local WOFF2 preload above is sufficient; avoids double-download -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FYP Expo Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FYP Expo Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2A1838">
  <meta name="color-scheme" content="light">
</head>
<body>
  <!-- Branded splash: visible at byte-zero while the Flutter engine
       downloads; removed by flutter_bootstrap.js on first frame. -->
  <noscript>
    <p style="font-family:sans-serif;padding:24px;max-width:36em">
      FYP Expo Hub needs JavaScript. Please turn it on in your browser settings and reload this page.
    </p>
  </noscript>
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-inner">
      <div class="splash-logo">FYP Expo Hub</div>
      <div class="splash-sub">FSKM Final Year Project Exhibition</div>
      <div class="splash-spinner" aria-hidden="true"></div>
      <div class="splash-loading">Loading…</div>
    </div>
  </div>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Warm Paper with a faint graph-paper grid, like the app's heroes. */
      background-color: #FAF7F2;
      background-image:
        linear-gradient(rgba(42, 24, 56, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 24, 56, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
      color: #2A1838;
      transition: opacity 0.35s ease;
    }
    #splash.splash-fade { opacity: 0; }
    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 0 24px;
      text-align: center;
    }
    .splash-logo {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #2A1838;
    }
    .splash-sub {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9A3A12;
    }
    .splash-spinner {
      margin-top: 10px;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(42, 24, 56, 0.12);
      border-top-color: #9A3A12;
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    .splash-loading {
      font-size: 11px;
      letter-spacing: 1px;
      color: #4E4652;
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-spinner { animation: none; border-top-color: #2A1838; }
      #splash { transition: none !important; }
    }
  </style>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
